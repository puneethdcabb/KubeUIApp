name: Build & Publish Standalone Exe

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore KubeUIApp.csproj

      - name: Build and Publish Standalone Single-File Executable
        run: >
          dotnet publish KubeUIApp.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./dist

      - name: Prepare Named Binary
        shell: pwsh
        run: |
          Copy-Item ./dist/KubeUIApp.exe ./dist/KubeShiftManager-win-x64.exe

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KubeShiftManager-Standalone-win-x64
          path: ./dist/KubeShiftManager-win-x64.exe
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "KubeShift Manager (Latest Standalone Build)"
          body: |
            ## Automated Standalone Release
            - **Commit**: ${{ github.sha }}
            - **Target Platform**: Windows x64 (`win-x64`)
            - **Architecture**: Self-contained single-file `.exe`
            - **Dependencies**: None. Includes embedded .NET 10, WPF framework, and SSH.NET runtimes.

            ### Instructions
            Download **`KubeShiftManager-win-x64.exe`** below and run directly on Windows 10/11. No installation required.
          draft: false
          prerelease: false
          files: ./dist/KubeShiftManager-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
